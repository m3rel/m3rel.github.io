<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<h1>squares</h1>

<label>kies een foto:</label>
<input type="file" id="file" accept="image/*">

<button id="save">save canvas</button>

<canvas id="c"></canvas>


<script type="module">

  const saveBtn = document.getElementById('save');
  const c = document.getElementById('c') // bovenaan, naast saveBtn

  saveBtn.addEventListener('click', function () {
    c.toBlob(function (blob) {
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = 'weave.png'
      a.click()
      setTimeout(() => URL.revokeObjectURL(url), 1000)
    }, 'image/png')
  })

  async function loadImage(src) {
    const img = new Image();
    img.src = src;
    await img.decode();
    return img;
  }

  const nrOfSquares = 8;
  const tiles = await Promise.all(
    Array.from({ length: nrOfSquares }, (_, i) => loadImage(`squares/${i + 1}.png`))
  );

  document.getElementById("file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const pic = await loadImage(URL.createObjectURL(file));
    draw(pic);
  });

  function draw(pic) {
    //pixelate to 10x10
    console.log(pic.width, pic.height, tiles.length)

    const canvas = document.createElement("canvas")
    canvas.width = 10;
    canvas.height = 10;

    const ctx = canvas.getContext("2d", { willReadFrequently: true })
    ctx.drawImage(pic, 0, 0, 10, 10)
    const data = ctx.getImageData(0, 0, 10, 10).data

    //draw raster
    const c = document.getElementById("c")
    c.width = 1000;
    c.height = 1000;
    const ctx2 = c.getContext("2d");

    const cel = 1000 / 10

    for (let y = 0; y < 10; y++) {
      for (let x = 0; x < 10; x++) {

        const index = (y * 10 + x) * 4
        const r = data[index]
        const g = data[index + 1]
        const b = data[index + 2]

        ctx2.fillStyle = `rgb(${r}, ${g}, ${b})`
        ctx2.fillRect(x * cel, y * cel, cel, cel)

        if (Math.random() < 0.3) {
          const tile = tiles[Math.floor(Math.random() * tiles.length)]
          // ctx2.filter = "saturate(400%) hue-rotate(120deg)"
          ctx2.drawImage(tile, x * cel, y * cel, cel, cel)
          //ctx2.filter = "none"

        }
      }
    }
  }


</script>
</body>
</html>
