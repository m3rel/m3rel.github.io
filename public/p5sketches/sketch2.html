<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
      body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<main>
  <input id="bg-color" type="color">
  <input type="range" id="rangeinput" name="vol" min="0" max="50">
</main>


<script>
  let range = 20;

  function setup() {

    createCanvas(400, 400);
    background(0, 0, 200);

    let colorpicker = document.getElementById("bg-color");

    colorpicker.addEventListener("input", function () {
      console.log(colorpicker.value);
      background(colorpicker.value);
    });

    let rangeInput = document.getElementById("rangeinput");
    range = Number(rangeInput.value);

    rangeInput.addEventListener(
      "change",
      function () {
        console.log(rangeInput.value)
        range = Number(rangeInput.value);
      },
      false
    );
  }

  function draw() {
    ellipse(mouseX, mouseY, range);
    //ellipse(mouseX, mouseY, 6)
  }

</script>
</body>
</html>
