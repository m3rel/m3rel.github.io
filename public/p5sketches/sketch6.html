<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>

  <style>
    .container {
        display: flex;
        flex-direction: column;
    }

    canvas {
        height: 80vh;
        width: auto;
    }

  </style>
</head>

<body>

<div class="container">
  <label>kies een foto:</label>
  <input type="file" id="file1" accept="image/*">
  <label>kies een tweede foto:</label>
  <input type="file" id="file2" accept="image/*">


  <div class="slidecontainer">
    <label>rows</label>
    <input type="range" min="1" max="100" value="50" class="slider" id="rows">
    <label>cols</label>
    <input type="range" min="1" max="100" value="50" class="slider" id="cols">
  </div>

  <div>
    <button id="save">save canvas</button>
  </div>
</div>

<canvas id="c"></canvas>

<p id="test"></p>


<!-- ------------------------ script --------------------------------- -->
<script>
  const file1input = document.getElementById('file1');
  const file2input = document.getElementById('file2');
  const canvas = document.getElementById('c');
  const colRange = document.getElementById('cols');
  const rowRange = document.getElementById('rows');

  const ctx = canvas.getContext('2d');
  const saveBtn = document.getElementById('save');

  let img1 = null;
  let img2 = null;

  let cols = 25;
  let rows = 20;

  //------------------------ temp
  const useTestImages = true;

  if (useTestImages) {
    img1 = new Image();
    img2 = new Image();

    img1.onload = tryWeave;
    img2.onload = tryWeave;

    img1.src = 'img/ezra.JPG';
    img2.src = 'img/hanna.JPG';
  }
  //temp -----------------------

  file1input.addEventListener('change', function () {
    const f1 = file1input.files[0];
    img1 = new Image();
    img1.onload = tryWeave;
    img1.src = URL.createObjectURL(f1);
  });

  file2input.addEventListener('change', function () {
    const f2 = file2input.files[0];
    img2 = new Image();
    img2.onload = tryWeave;
    img2.src = URL.createObjectURL(f2);
  });

  colRange.addEventListener('change', function () {
    cols = colRange.value;
    tryWeave();
  })

  rowRange.addEventListener('change', function () {
    rows = rowRange.value;
    tryWeave();
  })

  saveBtn.addEventListener('click', function () {
    canvas.toBlob(function (blob) {

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'weave.png';
      a.click();
      URL.revokeObjectURL(url);

    }, 'image/png');

    //canvas.toDataURL("image/jpeg")
  })

  function tryWeave() {
    //check if both img are ready
    if (img1 == null || img2 == null || !img1.complete || !img2.complete) {
      return;
    }
    photoWeave()
  }

  function photoWeave() {
    const test = document.getElementById('test');
    test.innerHTML = `photoweaving!!`

    canvas.width = img1.width;
    canvas.height = img1.height;

    const cellWidth = canvas.width / cols;
    const cellHeight = canvas.height / rows;

    const scaleX = img2.naturalWidth / canvas.width;
    const scaleY = img2.naturalHeight / canvas.height;

    ctx.drawImage(img1, 0, 0);

    for (let i = 0; i < rows; i++) {
      for (let j = 0; j < cols; j++) {

        //check if even
        if ((i + j) % 2 === 0)
        {
          console.log(i, j);

          const dx = j * cellWidth;
          const dy = i * cellHeight;

          ctx.drawImage(
            img2, dx * scaleX, dy * scaleY, cellWidth * scaleX, cellHeight * scaleY, dx, dy, cellWidth, cellHeight
          );
        }
      }
    }
  }
</script>
</body>
</html>
