<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>

  <style>
      canvas {
          display: block;
          max-width: 100%;
          max-height: 90vh;
          width: auto;
          height: auto;
      }
  </style>

</head>

<body>

<label>
  <input type="file" id="file" accept="image/*">
  kies een foto</label>

<br></br>
<label><span>kleur</span><input type="color" id="color" value="#0000FF"></label>

<button id="randomize">randomize</button>
<button id="save">save canvas</button>

<div class="stage">
  <canvas id="c"></canvas>
</div>

<script>
  const fileInput = document.getElementById('file');
  const colorInput = document.getElementById('color');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const randomizeBtn = document.getElementById('randomize');
  const saveBtn = document.getElementById('save');

  let img = null;

  const nrOfSquares = 20
  const size = 90;

  saveBtn.addEventListener('click', function () {
    canvas.toBlob(function (blob) {

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'squares.png';
      a.click();
      URL.revokeObjectURL(url);

    }, 'image/png');

    //canvas.toDataURL("image/jpeg")
  })

  fileInput.addEventListener('change', function () {
    const file = fileInput.files[0];
    img = new Image();
    img.onload = draw;//geen haakjes achter draw want anders voert ie de functie meteen uit
    img.src = URL.createObjectURL(file);
  });

  colorInput.addEventListener('input',  draw); //geen haakjes achter draw

  function draw() {
      if (img === null) {
        return;
      }

      canvas.width = img.width;
      canvas.height = img.height * 2;

      ctx.fillStyle = colorInput.value;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);


    for (let i = 0; i < nrOfSquares; i++) {

      const x = Math.floor(Math.random() * (img.width - size));
      const y = Math.floor(Math.random() * (img.height - size));

      const destX = Math.floor(Math.random() * (img.width - size));
      const destY = img.height + Math.floor(Math.random() * (img.height - size));

      ctx.drawImage(img, x, y, size, size, destX, destY, size, size);

      ctx.fillStyle = colorInput.value;
      ctx.fillRect(x, y, size, size);
    }
  }

  randomizeBtn.addEventListener('click', function () {
    if (img === null) return;
    draw();
  });

</script>
</body>
</html>
